name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Android export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint with zero warnings
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run deterministic tests
        run: pnpm test:run

      - name: Run Expo Doctor
        run: pnpm run doctor

      - name: Validate Android JavaScript export
        run: pnpm export:android
